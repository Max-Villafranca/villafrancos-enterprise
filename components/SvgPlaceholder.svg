// components/SvgPlaceholder.js
const SvgPlaceholder = ({
width = 100,
height = 100,
text = "Placeholder",
bgColor = "#cccccc",
textColor = "#333333",
className = ""
}) => {
// If width is a percentage, viewBox needs numerical values.
// This is a simplified approach; more complex logic might be needed for robust percentage handling.
const viewBoxWidth = typeof width === 'string' && width.includes('%') ? 100 : width;
const viewBoxHeight = typeof height === 'string' && height.includes('%') ? 100 : height;


return (
<svg width={width} // Can be "100%" height={height} viewBox={`0 0 ${viewBoxWidth} ${viewBoxHeight}`} // Use numerical
    values for viewBox xmlns="http://www.w3.org/2000/svg" className={className} aria-label={text}
    preserveAspectRatio="xMidYMid meet" // Good for responsiveness>
    <rect width="100%" height="100%" fill={bgColor} />
    <text x="50%" y="50%" dominantBaseline="middle" textAnchor="middle" fill={textColor}
        fontSize={Math.min(Number(viewBoxWidth), Number(viewBoxHeight)) / 7} // Dynamic font size
        fontFamily="sans-serif" fontWeight="bold">
        {text}
    </text>
</svg>
);
};

export default SvgPlaceholder;